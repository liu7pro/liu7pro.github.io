<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在前往新的 DomeOS AI 页面…</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/domeosai/en/about.html">
  <link rel="canonical" href="https://liu7pro.github.io/domeosai/en/about.html">
  <link rel="icon" href="/assets/img/app.ico" sizes="any">
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background: #0a0b0f;
      color: #e9ebf2;
    }
    .redirect-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 14px;
    }
    .redirect-card img { width: 22px; height: 22px; }
    .redirect-card a { color: #2e9df4; text-decoration: none; }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #2e9df4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: light) {
      body { background: #f7f8fa; color: #14161f; }
      .redirect-card { border-color: rgba(16, 20, 38, 0.1); background: #fff; }
      .spinner { border-color: rgba(16, 20, 38, 0.15); border-top-color: #1c86d8; }
      .redirect-card a { color: #1c86d8; }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <img src="/assets/img/logo.png" alt="">
    <span class="spinner" aria-hidden="true"></span>
    <span>页面已迁移，正在前往 <a href="/domeosai/en/about.html">/domeosai/en/about.html</a></span>
  </div>
</body>
</html>
