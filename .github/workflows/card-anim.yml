name: Append card rise animation

on:
  push:
    paths:
      - ".github/workflows/card-anim.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append CSS
        run: |
          if ! grep -q 'cardRise' assets/css/liquid.css; then
            printf '%s' '
/* card rise on scroll */
@keyframes cardRise {
  from { opacity: 0; translate: 0 30px; }
  to { opacity: 1; translate: 0 0; }
}

@supports (animation-timeline: view()) {
  body.home .m-grid .m-card {
    animation: cardRise linear both;
    animation-timeline: view();
    animation-range: entry 0% entry 55%;
  }
  body.home .m-grid .m-card:nth-child(2) { animation-range: entry 5% entry 60%; }
  body.home .m-grid .m-card:nth-child(3) { animation-range: entry 10% entry 65%; }
  body.home .m-grid .m-card:nth-child(4) { animation-range: entry 15% entry 70%; }
  body.home .m-release-card,
  body.home .m-notes {
    animation: cardRise linear both;
    animation-timeline: view();
    animation-range: entry 0% entry 50%;
  }
  body.home .m-notes { animation-range: entry 6% entry 56%; }
}

@media (prefers-reduced-motion: reduce) {
  body.home .m-grid .m-card,
  body.home .m-release-card,
  body.home .m-notes { animation: none; }
}
' >> assets/css/liquid.css
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/liquid.css
          if ! git diff --cached --quiet; then
            git commit -m "style: add scroll-driven card rise animation"
            git push origin HEAD:main
          fi
