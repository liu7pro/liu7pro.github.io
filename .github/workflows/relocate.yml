name: Restructure site

on:
  push:
    paths:
      - "scripts/relocate.py"
      - ".github/workflows/relocate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move pages into /domeosai and swap footer
        run: python3 scripts/relocate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: restructure site into /domeosai with Microsoft-style footer"
            git push origin HEAD:main
          fi
