name: Revert restructure

on:
  push:
    paths:
      - ".github/workflows/restore.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous layout
        run: |
          git checkout a874c1bc06953630fe0b66a0ffda5d3bebcf2a3d -- index.html about.html guide.html download.html legal.html 404.html en assets/js/main.js assets/js/config.js assets/css/style.css
          rm -rf domeosai music scripts
          rm -f .github/workflows/relocate.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "revert: restore previous site layout"
            git push origin HEAD:main
          fi
