name: Apply inner page styles

on:
  push:
    paths:
      - ".github/workflows/patch-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link pages.css
        run: |
          for f in guide.html download.html about.html legal.html; do
            if ! grep -q 'pages.css' "$f"; then
              sed -i '0,/\/head>/s|</head>|  <link rel="stylesheet" href="assets/css/pages.css">\n</head>|' "$f"
            fi
          done
          for f in en/guide.html en/download.html en/about.html en/legal.html; do
            if ! grep -q 'pages.css' "$f"; then
              sed -i '0,/\/head>/s|</head>|  <link rel="stylesheet" href="../assets/css/pages.css">\n</head>|' "$f"
            fi
          done
          if ! grep -q 'pages.css' 404.html; then
            sed -i '0,/\/head>/s|</head>|  <link rel="stylesheet" href="/assets/css/pages.css">\n</head>|' 404.html
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: apply moonshot glass style to inner pages"
            git push origin HEAD:main
          fi
