<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — DomeOS AI</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/img/app.ico" sizes="any">
  <style>
    html { background: #0a0b0f; color-scheme: dark; }
    html[data-theme="light"] { background: #f7f8fa; color-scheme: light; }
    .page-curtain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0b0f;
      pointer-events: none;
      animation: curtain-out 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }
    html[data-theme="light"] .page-curtain { background: #f7f8fa; }
    @keyframes curtain-out { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .page-curtain { display: none; } }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("domeos-theme");
        if (t === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="page-curtain" aria-hidden="true"></div>
  <div class="bg-scene" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="orb o4"></span>
    <span class="grain"></span>
  </div>
  <main class="not-found">
    <div>
      <div class="code">404</div>
      <h1>页面不存在 / Page not found</h1>
      <p>链接可能已失效，或地址写错。<br>The link may be broken, or the address is wrong.</p>
      <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:10px">
        <a class="btn btn-primary" href="/">返回首页</a>
        <a class="btn btn-ghost" href="/en/">English home</a>
      </div>
    </div>
  </main>
</body>
</html>
